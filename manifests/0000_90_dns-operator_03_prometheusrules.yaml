apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: dns
  namespace: openshift-dns-operator
  labels:
    role: alert-rules
  annotations:
    include.release.openshift.io/ibm-cloud-managed: "true"
    include.release.openshift.io/self-managed-high-availability: "true"
    include.release.openshift.io/single-node-developer: "true"
spec:
  groups:
    - name: openshift-dns.rules
      rules:
      - alert: CoreDNSPanicking
        expr: increase(coredns_panics_total[10m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: CoreDNS panic
          description: "{{ $value }} CoreDNS panics observed on {{ $labels.instance }}"
      - alert: CoreDNSHealthCheckSlow
        expr: histogram_quantile(.95, sum(rate(coredns_health_request_duration_seconds_bucket[5m])) by (instance, le)) > 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: CoreDNS health checks
          description: "CoreDNS Health Checks are slowing down (instance {{ $labels.instance }})"
      - alert: CoreDNSForwardHealthCheckBroken
        expr: sum by(namespace, instance) (rate(coredns_forward_healthcheck_broken_total[5m])) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: CoreDNS forward health checks are broken
          description: "CoreDNS forward health checks are failing for all upstreams on {{ $labels.instance }} in namespace {{ $labels.namespace }}. The underlying counter only advances when a query arrives, so this alert can clear during a traffic lull even though the outage persists; the per-upstream CoreDNSForwardHealthCheckFailure alerts keep firing in that case."
      - alert: CoreDNSForwardHealthCheckFailure
        expr: |
          (sum by(namespace, instance, to) (rate(coredns_proxy_healthcheck_failures_total{proxy_name="forward"}[5m])) > 0)
          unless on(namespace, instance)
          (ALERTS{alertname="CoreDNSForwardHealthCheckBroken",alertstate="firing"} == 1)
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: CoreDNS forward health check failure
          description: "CoreDNS forward health checks are failing for upstream {{ $labels.to }} on {{ $labels.instance }} in namespace {{ $labels.namespace }}."
      - alert: CoreDNSErrorsHigh
        expr: |
          (sum by(namespace) (rate(coredns_dns_responses_total{rcode="SERVFAIL"}[5m]))
            /
          sum by(namespace) (rate(coredns_dns_responses_total[5m])))
          > 0.01
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: CoreDNS serverfail
          description: "CoreDNS is returning SERVFAIL for {{ $value | humanizePercentage }} of requests."
          runbook_url: https://github.com/openshift/runbooks/blob/master/alerts/cluster-dns-operator/CoreDNSErrorsHigh.md
