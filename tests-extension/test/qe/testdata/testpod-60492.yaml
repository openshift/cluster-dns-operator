# The image is replaced at runtime by util.ReplacePayloadImage() with the pull spec of the
# release payload's "tools" imagestream tag, so this fixture is pullable in disconnected
# lanes (see OCPBUGS-132070, pattern 2).
#
# The test creates this pod as the namespace user; restricted-v2 assigns a non-root UID.
apiVersion: v1
kind: Pod 
metadata:
  name: testpod-60492
  labels:
    app: testpod-60492
spec:
  automountServiceAccountToken: false
  securityContext:
    seccompProfile:
      type: RuntimeDefault
  containers:
  - name: testpod-60492
    image: PAYLOAD_TOOLS_IMAGE
    securityContext:
      runAsNonRoot: true
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
        - ALL
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 64Mi
    readinessProbe:
      exec:
        command: ['sh', '-c', 'true']
      initialDelaySeconds: 1
      periodSeconds: 5
    livenessProbe:
      exec:
        command: ['sh', '-c', 'true']
      initialDelaySeconds: 5
      periodSeconds: 10
    command: ['sh', '-c', 'echo The app is running! && sleep 3600']
  dnsPolicy: ClusterFirst
  dnsConfig:
     searches: [aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa.bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb.ccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc.ddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddd]

