# The image is replaced at runtime by util.ReplacePayloadImage() with the pull spec of the
# release payload's "tools" imagestream tag. The payload registry is mirrored into
# disconnected lanes, unlike the quay.io/openshifttest images this fixture used to carry
# (see OCPBUGS-132070, pattern 2). The "tools" image provides dig, nslookup, curl and getent,
# which is everything the DNS client-side assertions need.
#
# Create this fixture as the namespace's test user so restricted-v2 assigns a non-root
# UID, including when the namespace permits privileged pods. The tools image defaults
# to root, so admin creation without UID assignment would fail runAsNonRoot validation.
apiVersion: v1
kind: Pod
metadata:
  labels:
    app: hello-pod
  name: hello-pod
spec:
  automountServiceAccountToken: false
  securityContext:
    seccompProfile:
      type: RuntimeDefault
  containers:
  - image: PAYLOAD_TOOLS_IMAGE
    name: hello-pod
    command: ["/bin/sh", "-c", "trap 'exit 0' TERM; sleep infinity & wait"]
    securityContext:
      runAsNonRoot: true
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
        - ALL
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi
