# This CoreDNS server listens on 5353, not 53.
#
# The pod is admitted under the restricted-v2 SCC, which injects a non-root runAsUser even
# though the test labels the namespace pod-security "privileged" - SCC selection is driven
# by the creating user's RBAC, not by the PodSecurity labels. With a non-root UID and
# allowPrivilegeEscalation: false, NET_BIND_SERVICE would stay in the bounding set and
# never become effective, so binding a privileged port failed with
# "Listen: listen tcp :53: bind: permission denied" and the pod never became Ready.
#
# Listening above 1024 keeps the fixture working under the restricted SCC, and means no
# added capability is needed at all - capabilities are dropped to ALL. Callers must
# forward to 5353; see the upstreamResolvers patch in OCP-46875.
apiVersion: v1
kind: Pod
metadata:
  labels:
    name: test-coredns
  name: test-coredns
spec:
  securityContext:
    runAsNonRoot: false
    seccompProfile:
      type: RuntimeDefault
  containers:
  - args:
    - -conf
    - /etc/coredns/Corefile
    command:
    - coredns
    image: replaced-at-runtime
    imagePullPolicy: IfNotPresent
    name: coredns
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
        - ALL
    volumeMounts:
    - mountPath: /etc/coredns
      name: config-volume
      readOnly: true
  nodeSelector:
    kubernetes.io/os: linux
  volumes:
  - configMap:
      defaultMode: 420
      items:
      - key: Corefile
        path: Corefile
      name: test-coredns-cm
    name: config-volume
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: test-coredns-cm
data:
  Corefile: |
    .:5353 {
        bufsize 512
        errors
        log . {
            class error
        }
        health {
            lameduck 20s
        }
        ready
        template ANY MX {
            rcode NXDOMAIN
        }
        hosts {
            192.168.11.241     www.myocp-test.com
            2000::abcd     myocp-testv6.com
        }
        prometheus 127.0.0.1:9153
        forward . 8.8.8.8 {
            policy random
        }
        cache 900 {
            denial 9984 30
        }
        reload
    }
