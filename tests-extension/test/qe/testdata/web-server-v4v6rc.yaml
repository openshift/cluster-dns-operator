# The image is replaced at runtime by util.ReplacePayloadImage() with the pull spec of the
# release payload's "tools" imagestream tag, so this fixture is pullable in disconnected
# lanes (see OCPBUGS-132070, pattern 2).
#
# OCP-39842 only asserts that the two dual-stack Services get v4+v6 clusterIPs and that
# their names resolve to those addresses via getent from inside the pod. Nothing ever
# connects to the container, so the probes are exec probes rather than httpGet and no HTTP
# server is required. The Services keep their ports so the dual-stack allocation is
# exercised unchanged.
#
# The workload's service account uses restricted-v2, which assigns a non-root UID.
apiVersion: v1
kind: List
items:
- apiVersion: apps/v1
  kind: Deployment
  metadata:
    labels:
      name: web-server-v4v6rc
    name: web-server-v4v6rc
  spec:
    replicas: 1
    selector:
      matchLabels:
        name: web-server-v4v6rc
    template:
      metadata:
        labels:
          name: web-server-v4v6rc
      spec:
        automountServiceAccountToken: false
        securityContext:
          seccompProfile:
            type: RuntimeDefault
        containers:
        - image: PAYLOAD_TOOLS_IMAGE
          name: web-server
          command: ["/bin/sh", "-c", "trap 'exit 0' TERM; sleep infinity & wait"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
          readinessProbe:
            exec:
              command: ['sh', '-c', 'true']
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ['sh', '-c', 'true']
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
              - ALL
- apiVersion: v1
  kind: Service
  metadata:
    labels:
      name: service-securev4v6
    name: service-securev4v6
  spec:
    ipFamilyPolicy: PreferDualStack
    ports:
    - name: https
      port: 27443
      protocol: TCP
      targetPort: 8443
    selector:
      name: web-server-v4v6rc
- apiVersion: v1
  kind: Service
  metadata:
    labels:
      name: service-unsecurev4v6
    name: service-unsecurev4v6
  spec:
    ipFamilyPolicy: PreferDualStack
    ports:
    - name: http
      port: 27017
      protocol: TCP
      targetPort: 8080
    selector:
      name: web-server-v4v6rc
